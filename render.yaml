services:
  - type: web
    name: himchangym-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: baby-rental-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: AUTO_SETUP
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://himchangym-web-six.vercel.app,https://himchangym-admin-kappa.vercel.app
      - key: SEED_ADMIN_EMAIL
        value: admin@example.test
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_MEMBER_PASSWORD
        sync: false
      - key: SEED_TRAINER_PASSWORD
        sync: false
